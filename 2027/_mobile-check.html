<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>mobile render check</title>
<style>
  body{margin:0;background:#d8d3c8;font:12px/1.4 -apple-system,sans-serif;padding:10px}

  .col{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.2)}

  iframe{display:block;border:0;background:#fff}
</style></head>
<body>
<div class="row">
  <div class="col"><div class="cap">390 x 844</div><iframe src="./" width="390" height="844"></iframe></div>
  <div class="col"><div class="cap">360 x 780</div><iframe src="./" width="360" height="780"></iframe></div>
</div>
</body>
</html>
