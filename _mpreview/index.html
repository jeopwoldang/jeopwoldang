<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile preview</title>
<style>
  body{margin:0;background:#1a1336;font-family:system-ui,sans-serif;color:#ddd;display:flex;gap:16px;padding:10px}
  figure{margin:0}
  figcaption{font-size:11px;padding:4px 2px;color:#ccc}
  iframe{width:390px;height:1500px;border:1px solid #665;background:#fff;display:block}
</style>
</head>
<body>
<figure><figcaption>shop · products(diary)</figcaption><iframe data-to="#products" src="https://jeopwoldang.github.io/jeopwoldang/shop/"></iframe></figure>
<figure><figcaption>shop · event</figcaption><iframe data-to="#event" src="https://jeopwoldang.github.io/jeopwoldang/shop/"></iframe></figure>
<figure><figcaption>store · event</figcaption><iframe data-to="#event" src="https://jeopwoldang.github.io/jeopwoldang/store/"></iframe></figure>
<script>
  function go(){
    document.querySelectorAll('iframe').forEach(function(f){
      try{
        var d = f.contentWindow.document, el = d.querySelector(f.dataset.to);
        if(el){
          var y = el.getBoundingClientRect().top + f.contentWindow.scrollY - 70;
          f.contentWindow.scrollTo(0, Math.max(0, y));
        }
      }catch(e){}
    });
  }
  window.addEventListener('load', function(){ setTimeout(go, 900); setTimeout(go, 2200); setTimeout(go, 3600); });
</script>
</body>
</html>
