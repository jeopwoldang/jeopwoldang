<!doctype html><html lang="ko"><meta charset="utf-8"><title>mobile layout check</title>
<style>html,body{margin:0;padding:0;background:#222}iframe{display:block;width:390px;height:720px;border:0}</style>
<iframe id="f" src="/store/?v=wallm"></iframe>
<script>
var f=document.getElementById('f');
f.addEventListener('load',function(){
  try{
    var w=f.contentWindow, d=f.contentDocument, el=d.getElementById('digital');
    if(el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 6);
  }catch(e){}
});
</script>
</html>
